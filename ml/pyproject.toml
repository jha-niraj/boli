[project]
name = "boli-ml"
version = "0.1.0"
description = "Boli offline ML tooling: eval harness, ONNX export, fine-tuning. Never in the request path."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "soxr>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boli_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v"]
